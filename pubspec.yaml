name: dogapp
description: 犬の健康管理アプリ(スタンダードプードル2匹飼育を想定したプロトタイプ)
publish_to: "none"
version: 0.1.0

environment:
  sdk: ">=3.3.0 <4.0.0"

dependencies:
  flutter:
    sdk: flutter
  flutter_localizations:
    sdk: flutter
  intl: any
  # チャートはCustomPainterで自前実装、アイコンはMaterial Iconsのみを使用という
  # "no deps"方針は維持しつつ、dogapp-apiとの通信のみhttpパッケージを利用する
  # (README「今後の実装」参照)。
  http: ^1.2.2
  # 「写真を撮る・選ぶ」から実際の画像を取得してAPIへ送るために使用。
  image_picker: ^1.1.2
  # 散歩GPS記録機能用。
  geolocator: ^13.0.1
  flutter_map: ^7.0.2
  latlong2: ^0.9.1
  # 犬プロフィールカードをOSの共有シート(Instagram等)経由でシェアするために使用。
  share_plus: ^13.3.0
  path_provider: ^2.1.6
  # ログイントークンを端末に永続化するために使用。
  shared_preferences: ^2.3.2

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^4.0.0

flutter:
  uses-material-design: true
  generate: true
  # 本番では以下のようにFraunces/Inter/JetBrains Monoフォントを
  # assets/fonts に配置してWebプロトタイプ(DogHealthApp.jsx)と
  # 見た目を統一することを推奨する。
  # fonts:
  #   - family: Fraunces
  #     fonts:
  #       - asset: assets/fonts/Fraunces-Regular.ttf
  #       - asset: assets/fonts/Fraunces-SemiBold.ttf
  #         weight: 600
